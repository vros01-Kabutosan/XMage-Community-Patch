name: Foundation completeness smoke

on:
  push:
    branches:
      - work/source-foundation-v-1.7-complete-target
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-completeness-v-1.7
  cancel-in-progress: true

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/rc1.1-complete-community
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: source/rc1.1-complete-community/pom.xml

      - name: Compile client and dependencies with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if mvn -B -U -pl Mage.Client -am test; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            echo "Maven attempt $attempt failed; waiting before retry"
            sleep 20
          done

      - name: Verify restored source package
        shell: bash
        run: |
          community_count=$(find Mage/src/main/java/mage/target -type f -name '*.java' | wc -l)
          upstream_count=$(find ../upstream-07ecb7cf/Mage/src/main/java/mage/target -type f -name '*.java' | wc -l)
          test "$community_count" -eq 84
          test "$upstream_count" -eq 84
          echo "community mage/target files: $community_count"
          echo "upstream mage/target files: $upstream_count"
